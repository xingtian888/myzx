<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localstorage</title>
</head>
<body>
      <h2>localStorage</h2>
      <button onclick="saveData()">点我保存一个数据</button>
      <button onclick="getData()">点我获取数据2</button>
      <button onclick="deleteData()">删除数据</button> 
      <button onclick="clear1()">清空数据</button>  
</body>
<script type="text/javascript">
       let persion = {name:"张三",age:19};
       function saveData(){
           localStorage.setItem("msg","hello")
           localStorage.setItem("msg2","hello")
           localStorage.setItem("p",JSON.stringify(persion))
       }

       function getData(){
            console.info(localStorage.getItem("msg")) 
 
       }
       function deleteData(){           
           localStorage.removeItem("msg")
       }
        function clear1(){
            alert("clear")
           localStorage.clear()
 
       }
</script>
</html>
