<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>键盘事件</title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <h1> 键盘事件 {{name}} </h1>
        <input  @keyup.ctrl.y="showinfo" type="text" value="1"/>
    </div>
     <script type="text/javascript">
        Vue.config.productionTip = false 
        new Vue({
           el:'#root',
           data: {
             name : '尚硅谷'
           } ,
           methods:{
              showinfo(e){
                console.info(e.target.value)
              }

           }
        })
     </script>
</body>
</html>
