<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件代理</title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <h1> 你好 {{name}} </h1>
        <button  v-on:click="showinfo1" >不传参数</button> <br>
        <button  @click="showinfo2($event,3)" >传参数</button>
    </div>
     <script type="text/javascript">
        Vue.config.productionTip = false 
        new Vue({
           el:'#root',
           data: {
             name : '尚硅谷'
           } ,
           methods:{
              showinfo1(){
                alert("NO 参数")
              },

               showinfo2(event,value){
                console.info(event)
                console.info(value)
                alert("NO 参数")
              },

           }
        })
     </script>
</body>
</html>
