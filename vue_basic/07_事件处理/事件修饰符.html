<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件代理</title>
    <script type="text/javascript" src="../js/vue.js"></script>
    <style>
        *{
         margin-top: 20px;
        }
        .demo1{
            height: 50px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div id="root">
        <h1> 你好 {{name}} </h1>
         <!-- 阻止事件默认 -->
         <a href="http://baidu.com" @click.prevent="showinfo1">点我提示信息</a>
         <!-- 阻止事件冒泡 -->
          <div @click="showinfo1" class="demo1">
            <button  @click="showinfo1">点我提示信息</button>
         </div>

         <!-- 事件只触发一次 -->
                   
            <button  @click.once="showinfo1">事件只触发一次</button>
          
    </div>
     <script type="text/javascript">
        Vue.config.productionTip = false 
        new Vue({
           el:'#root',
           data: {
             name : '尚硅谷'
           } ,
           methods:{
              showinfo1(e){
               //  e.preventDefault();
                alert("你好")
              },

               showinfo2(event,value){
                console.info(event)
                console.info(value)
                alert("NO 参数")
              },

           }
        })
     </script>
</body>
</html>
