<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始VUE</title>
    <script type="text/javascript" src="../js/vue.js"></script>
      <style>
    .basic {
      width: 200px;
      height: 100px;
      border: 4px solid red;
      background-color: white;
    }

    .normal {
      background-color: aliceblue;
    }

    .bad {
      background-color: chartreuse;
    }

    .happy {
      background-color: chocolate;
    }

    .x1 {
      background-color: coral;
    }

    .x2 {
      font-size: medium;
      font-weight: 700
    }

    .x3 {
      border-radius: 10px;
    }
  </style>
</head>
<body>
    <div id="root">
        <!-- 表达式是对象 -->
        <div class="basic" :class="classObj">
          <h1> 你好 {{name}} </h1>
        </div>
        <br> <br>
        <!-- 表达式是数组 -->
        <div class="basic" :class="classArray">
          <h1> 你好 {{name}} </h1>
        </div>
             <!-- Style绑定 -->
        <div class="basic" :style="{ color: activeColor, fontSize: fontSize + 'px' }">
          <h1> 你好 {{name}} </h1>
        </div>

    </div>
     <script type="text/javascript">
        Vue.config.productionTip = false 
        const vm = new Vue({
           el:'#root',
           data: {
             name : '尚硅谷',
             mode : 'normal',
             classObj :{normal:true,bad:true},
             classArray:['normal','happy','bad'],
             activeColor:"red",
             fontSize : 50
           } 
        })
     </script>
</body>
</html>
