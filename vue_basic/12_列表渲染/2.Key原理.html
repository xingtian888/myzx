<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始VUE</title>
    <script type="text/javascript" src="../js/vue.js"></script>
      <style>
    .basic {
      width: 200px;
      height: 100px;
      border: 4px solid red;
      background-color: white;
    }

    .normal {
      background-color: aliceblue;
    }

    .bad {
      background-color: chartreuse;
    }

    .happy {
      background-color: chocolate;
    }

    .x1 {
      background-color: coral;
    }

    .x2 {
      font-size: medium;
      font-weight: 700
    }

    .x3 {
      border-radius: 10px;
    }
  </style>
</head>
<body>
    <div id="root">
        <span>人员列表(数组)</span> <br/>
        <input type="text" placeholder="请输入人名" v-model="keyword">
        <ul>
           <li v-for="(item,index) in persons" :key="item.id">
             {{item.name}} -{{item.sex}} -  {{item.age}}  
           </li>

           <button v-on:click="add">增加人员1</button>
         </ul>
            

 

 
    </div>
     <script type="text/javascript">
        Vue.config.productionTip = false 
        const vm = new Vue({
           el:'#root',
           data: {
             name : '尚硅谷',
             mode : 'normal',
             keyword:"",
             persons : [
              {id:"001",name:"马冬梅",age:18,sex:'男'},
              {id:"002",name:"周冬雨",age:19,sex:'男'},
              {id:"003",name:"周杰伦",age:20,sex:'女'},
              {id:"004",name:"温兆伦",age:21,sex:'女'}
              ],
             person :{
               id : "001",
               name : "zhangshan",
               age:18
             } 
           } ,
           methods:{
              add(){
                 let e = {id:"004",name:"温兆伦",age:21,sex:'女'}
                 this.persons.unshift(e);
              }
           },
           watch:{
             keyword(newValue,oldValue){
                 console.info(newValue,oldValue)
             }
           }
        })
     </script>
</body>
</html>
