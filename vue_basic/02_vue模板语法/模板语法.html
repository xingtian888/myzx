<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始VUE</title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <h1>插值语法</h1>
        <h3> 你好 {{name}} </h3>
        <hr/>
        <h1>指令语法</h1>
        <a :href="school.url" x="hello">去{{school.name}}</a>
    </div>
     <script type="text/javascript">
        Vue.config.productionTip = false 
        new Vue({
           el:'#root',
           data: {
             name : 'jack',
             school :{
               url: "http://www.baidu.com",
               name: "nihao"
             }
           } 
        })
     </script>
</body>
</html>
