<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据代理 回顾  object defineProperty ></Object></title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <h1> 你好 {{name}} </h1>
    </div>
     <script type="text/javascript">
        Vue.config.productionTip = false 
        new Vue({
           el:'#root',
           data: {
             name : '尚硅谷'
           } 
        })
     </script>
</body>
</html>
