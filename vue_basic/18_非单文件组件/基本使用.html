<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>非单文件组件----基本使用</title>
    <script type="text/javascript" src="../js/vue.js"></script>
</head>
<body>
    <div id="root">
        <h1> 你好 {{name}} </h1>
        <school></school>
    </div>
     <script type="text/javascript">

        Vue.config.productionTip = false 

            const student = Vue.extend({
               name:"student",
               template : `
                 <div>
                 <h2>姓名:{{name}}</h2>
                 <h2>年龄:{{age}}</h2>
                 </div>
               `,
               data(){
                  return {
                      name : "张三",
                      age :18

                  }
               }

            })

        const school = Vue.extend({
               name:"school",
               template : `
                 <div>
                 <h2>名称:{{name}}</h2>
                 <h2>地址:{{address}}</h2>
                 <student></student>
                 </div>
               `,
               data(){
                  return {
                      name : "尚硅谷",
                      address :"北京昌平"

                  }
               },
               components:{
                 student
               }

        })

        new Vue({
           el:'#root',
           data: {
             name : '尚硅谷'

           } ,
           components:{
               school:school
            }
        })
     </script>
</body>
</html>
